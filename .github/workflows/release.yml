name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build universal app
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh
          codesign --verify --deep --strict dist/Launch.app
          ditto -c -k --keepParent --norsrc --noextattr \
            dist/Launch.app \
            "Launch-${GITHUB_REF_NAME#v}-universal.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Launch-${GITHUB_REF_NAME#v}-universal.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MAC-Launch $GITHUB_REF_NAME" \
            --notes "macOS 14+，Intel 与 Apple Silicon 通用版本。首次启动若被系统阻止，请在 Finder 中右键 App 并选择“打开”。当前构建未经过 Apple 公证。"
